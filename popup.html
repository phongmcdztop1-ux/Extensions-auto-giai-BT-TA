<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cre: Phong</title>
    <!-- KaTeX CSS (local) -->
    <link rel="stylesheet" href="lib/katex.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 450px;
            padding: 15px;
            background-color: #1a1a2e;
            margin: 0;
            color: #eee;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin: 0 0 10px;
            color: #00d4ff;
        }

        p {
            font-size: 14px;
            text-align: center;
            margin: 0 0 15px;
            color: #aaa;
        }

        label {
            font-size: 14px;
            margin-top: 10px;
            display: block;
            color: #eee;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            resize: vertical;
            color: #eee;
            background-color: #16213e;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #main-content.visible {
            opacity: 1;
        }

        #status {
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        #spinner {
            text-align: center;
            margin: 10px 0;
        }

        #spinner img {
            display: inline-block;
        }

        #error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        #response-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        #response {
            font-size: 14px;
            line-height: 1.8;
            max-height: 400px;
            overflow-y: auto;
            background-color: #16213e;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            color: #eee;
        }

        /* KaTeX custom styles for dark theme */
        #response .katex {
            color: #7dd3fc;
            font-size: 1.1em;
        }

        #response .katex-display {
            margin: 15px 0;
            padding: 10px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow-x: auto;
        }

        #response .katex-display>.katex {
            color: #a5f3fc;
        }

        /* Math display blocks */
        #response .math-display {
            display: block;
            margin: 12px 0;
            padding: 12px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow-x: auto;
            text-align: center;
        }

        #response .math-inline {
            display: inline;
        }

        /* Scrollbar styling */
        #response::-webkit-scrollbar {
            width: 8px;
        }

        #response::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 4px;
        }

        #response::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        #response::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>

<body>
    <h1>cre: Phong</h1>
    <p>Chụp màn hình và nó sẽ tự động giải bài tập tự động cho mày!</p>
    <div id="initial-content">
        <label for="description">Mô tả:</label>
        <p style="font-size: 12px; color: #777;">Nhập mô tả của bài tập như đề bài, yêu cầu nếu A.I chưa hiểu được ý của
            đề bài
            | Đôi khi nó giải ngu nên hãy thông cảm</p>
        <textarea id="description" placeholder="Nhập mô tả bài tập..."></textarea>
        <button id="captureBtn">Bắt đầu giải bài</button>
    </div>
    <div id="main-content">
        <div id="status">Đang xử lý...</div>
        <div id="spinner">
            <img src="https://cdnjs.cloudflare.com/ajax/libs/galleriffic/2.0.1/css/loader.gif" alt="Loading">
        </div>
        <div id="error"></div>
        <div id="response-title">Kết quả giải bài</div>
        <div id="response"></div>
    </div>
    <!-- KaTeX JS (local) -->
    <script src="lib/katex.min.js"></script>
    <script src="lib/auto-render.min.js"></script>
    <script src="popup.js"></script>
</body>

</html>
